schema: spec-driven

context: |
  Projeto: Salvy — Monólito modular em um único app Next.js (App Router) na raiz do repositório com backend Node.js integrado, gerenciado com `npm`.
  Idioma: Escreva todos os artefatos (proposal, specs, design, tasks) e comentários em Português (pt-BR).

  Stack e Limites Arquiteturais:
  - Frontend/Backend: Next.js (App Router), React, TypeScript estrito (proibido `any`, use `unknown` + validação para dados externos), Node.js, Route Handlers.
  - UI e Estado: Tailwind CSS, shadcn/ui, TanStack Query (via hooks gerados pelo Orval em `@/lib/api-client`), Fetch nativo, Zod.
  - Documentação Interativa de API: Scalar servido via Route Handler (`src/app/api/docs/route.ts`) usando CDN oficial (zero dependências extras) e lendo diretamente o `openapi.yaml` da raiz.
  - Testes: Vitest e Testing Library.
  - Proibições: NÃO introduza Express, outro servidor, Server Actions, banco de dados, ORM, filas, workers, CSS Modules, Redux, Axios, TanStack Router ou TanStack Table.
  - Gerenciador de pacotes: Use exclusivamente `npm` (não use `pnpm` ou `yarn`). Não instale novos pacotes sem apresentar motivo, alternativas, custos e obter aprovação.

  Arquitetura em 5 Camadas (dependências apontam sempre para dentro):
  1. Interface (`src/app`, `src/components`, `src/hooks`): Server Components por padrão (`"use client"` apenas quando necessário). Lógica compartilhada em hooks (ex: `src/hooks/use-line-workflow.ts`). Não acessa TOM, repositório ou `fetch` direto.
  2. Adaptadores HTTP (`src/app/api`): Route Handlers (`runtime = "nodejs"`, `dynamic = "force-dynamic"`, `Cache-Control: no-store`). Apenas valida entrada, chama casos de uso e formata resposta HTTP (além de servir a UI do Scalar em `/api/docs`). Sem regras de negócio.
  3. Aplicação (`src/server/application`): Casos de uso (preparar, executar, consultar, listar) e interfaces mínimas (ports) para repositório e gateway TOM. Sem dependência de Next.js ou HTTP.
  4. Domínio (`src/server/domain`): Entidades (`Solicitação` != `Linha Confirmada`), estados (`PREPARADA`, `PROCESSANDO`, `CONCLUÍDA`, `FALHA_CONFIRMADA`, `RESULTADO_INCERTO`), transições centralizadas e invariantes. Puro (sem React, Next.js ou HTTP).
  5. Infraestrutura (`src/server/infrastructure`): Repositório em memória (singleton em `globalThis` para preservar no hot reload) e adaptador TOM (`fetch` nativo).

  Convenções de Código e Contrato:
  - Imports: Use `@/` para importar de `src/`. Use `import type` para tipos.
  - Nomenclatura: `camelCase` (funções/variáveis), `PascalCase` (componentes/tipos), `kebab-case` (arquivos).
  - OpenAPI (`openapi.yaml` na raiz): Fonte canônica única tanto para geração de código em `src/lib/api-client/` via `npm run codegen` (Orval) quanto para a referência interativa do Scalar em `/api/docs`. Nunca edite arquivos gerados manualmente nem duplique a especificação OpenAPI.

rules:
  proposal:
    - "Verifique a implementação atual antes de propor mudanças; não presuma que rotas, componentes ou testes descritos em interfaces já existem."
    - "Sempre inclua uma seção explícita Fora de Escopo (Out of Scope) reforçando que não haverá persistência em banco, filas ou pacotes extras."
    - "Caso a mudança altere contratos HTTP, explicite o impacto no `openapi.yaml`, na geração do Orval (`src/lib/api-client/`) e na documentação exibida pelo Scalar em `/api/docs`."

  specs:
    - "Escreva os cenários em formato Given/When/Then cobrindo os estados exatos `PREPARADA`, `PROCESSANDO`, `CONCLUÍDA`, `FALHA_CONFIRMADA` e `RESULTADO_INCERTO`."
    - "Requisito para `POST /api/requests` — valida o catálogo (`src/lib/catalog.ts` com DDD válido e planos 1 a 4), gera código com `crypto.randomUUID()`, retorna `201` e NÃO chama a TOM."
    - "Requisito para `GET /api/requests/{code}` — apenas lê o estado local (`404` se desconhecido ou reiniciado) sem efeitos colaterais."
    - "Requisito para `POST /api/requests/{code}/execute` — não aceita corpo mutável, marca `PROCESSANDO` sincronamente antes do primeiro `await`, retorna `200` (ou `202` se já estiver processando) e usa o código como `idempotencyKey`."
    - "Requisito para `GET /api/lines` — retorna apenas linhas confirmadas (contendo código da solicitação, `phoneNumber` e instante de confirmação; DDD e plano são derivados da solicitação)."
    - "Requisito para `GET /api/docs` — renderiza a documentação interativa do Scalar lendo o `openapi.yaml` atualizado com `Cache-Control: no-store`."
    - "Tratamento de falhas e incertezas — timeout (60s via `AbortController` cobrindo leitura do body), erro de rede, HTTP 5xx ou payload inválido resultam em `RESULTADO_INCERTO` (nunca falha confirmada ou linha fictícia). Uma rejeição posterior não sobrescreve `RESULTADO_INCERTO` anterior."
    - "Requisitos de UI — salvar código no `sessionStorage` antes de executar (abortar execução se falhar), trava com `useRef` contra duplo clique, retomada após reload apenas via consulta (`GET`) sem reenvio automático, e feedback acessível (sem depender apenas de cor)."

  design:
    - "Detalhe a separação estrita entre as 5 camadas e as assinaturas das portas (`Repository` e `TomGateway`) na camada de aplicação."
    - "Se houver alteração de contrato HTTP, desenhe primeiro a mudança no `openapi.yaml` preservando `info.title: Api`, `servers.url: /api`, `operationId`s e o mutator `customFetch` (`src/lib/custom-fetch.ts`). Inclua `summary`, `description` e exemplos claros de request/response para enriquecer a UI do Scalar em `/api/docs`."
    - "Mantenha a integração do Scalar em `src/app/api/docs/route.ts` via script CDN (`https://cdn.jsdelivr.net/npm/@scalar/api-reference`) injetando o `openapi.yaml` lido da raiz do projeto (`path.join(process.cwd(), \"openapi.yaml\")`) para evitar instalar novas dependências."
    - "Documente o controle de concorrência no repositório em memória (transição síncrona para `PROCESSANDO` antes do primeiro `await` e atualização atômica entre solicitação e linha)."
    - "Garanta isolamento de segurança na integração TOM (`POST https://1wvur6wjzc.execute-api.us-east-1.amazonaws.com/phone-number`) com uso exclusivo de `process.env.TOM_API_KEY` (carregado via `.env.local` no servidor), bloqueio de redirecionamentos, sem repassar `AbortSignal` do navegador para a TOM e com logs estruturados sanitizados (sem expor API key, telefone completo, headers ou payload bruto)."
    - "Padronize erros HTTP no formato `{ error, code, fieldErrors? }` (`400` para validação, `404` para código não encontrado)."

  tasks:
    - "Se houver mudança no contrato HTTP, a Tarefa 1 deve ser atualizar `openapi.yaml`, rodar `npm run codegen` e garantir que a rota `/api/docs` (Scalar) reflita o contrato atualizado."
    - "Ordene as tarefas de dentro para fora — 1) Domínio e Catálogo, 2) Casos de Uso (Aplicação), 3) Repositório em Memória e Gateway TOM (Infra), 4) Route Handlers HTTP e `/api/docs`, 5) Hooks e Componentes (UI)."
    - "Inclua tarefas obrigatórias de testes unitários (com repositório isolado e gateway TOM fake injetados, sem chamadas reais) cobrindo catálogo, UUID no servidor, imutabilidade, sucesso, idempotência em `CONCLUÍDA`, bloqueio de concorrência em `PROCESSANDO`, transições de estado, timeout/payload inválido gerando `RESULTADO_INCERTO`, preservação de `RESULTADO_INCERTO`, `404` pós-reinício e retentativa manual."
    - "Inclua tarefas de testes de interface (Testing Library) cobrindo rótulos/acessibilidade, navegação por teclado, mensagens de erro, sucesso/falha no `sessionStorage`, recuperação após reload sem `POST` automático e bloqueio de duplo clique."
    - "Finalize a lista de tarefas com a execução dos comandos de verificação (`npm run typecheck` e `npm test`)."

operations:
  apply:
    guidance:
      - "Antes de editar qualquer arquivo, leia a implementação existente para respeitar tipos, helpers e convenções já presentes no projeto."
      - "Nunca edite manualmente os arquivos gerados pelo Orval em `src/lib/api-client/`; se precisar ajustar tipos ou hooks da API, edite `openapi.yaml` e execute `npm run codegen`."
      - "Ao editar `openapi.yaml`, mantenha a sintaxe YAML válida e descrições claras para não quebrar nem o codegen do Orval nem a renderização do Scalar em `/api/docs`."
      - "No cliente React Query, mantenha `retry: false`, `refetchOnWindowFocus: false` e `refetchOnReconnect: false` para queries, e `retry: false` com `networkMode: \"always\"` para mutations."
      - "Antes de concluir a implementação, execute obrigatoriamente `npm run typecheck` e `npm test`."

  archive:
    guidance:
      - "Confirme que todos os testes unitários e de interface passaram, que `/api/docs` (Scalar) e o codegen do Orval (`src/lib/api-client/`) estão sincronizados com o `openapi.yaml`, e que nenhum `any`, dado mockado em produção ou log sensível foi introduzido antes de arquivar a mudança."